<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Prices Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ---- Design tokens (from Figma) ---- */
    :root{
      --text-primary:#00223e;
      --text-white:#ffffff;
      --text-muted:#5b6b78;
      --surface-white:#ffffff;
      --surface-primary:#00223e;
      --surface-quarternary:#d9dee2;
      --surface-quinary:#f0f2f3;
      --surface-success:#adebad;
      --accent:#c9ee00;
      --stroke-primary:#d9dee2;
      --radius-m:8px;
      --radius-l:16px;
      --radius-full:999px;
      --sp-2xs:4px; --sp-xs:8px; --sp-s:12px; --sp-m:16px; --sp-xl:24px;
      --shadow-s:0 1px 4px rgba(0,34,62,.05), 0 4px 8px rgba(0,34,62,.10);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{margin:0;padding:0;height:100%;}
    body{
      font-family:'Figtree',system-ui,-apple-system,sans-serif;
      color:var(--text-primary);
      background:var(--surface-primary);
      font-size:16px;line-height:24px;
      -webkit-font-smoothing:antialiased;
    }
    button{font:inherit;color:inherit;border:0;background:transparent;cursor:pointer;}
    /* Phone column: full width on mobile, centred phone frame on larger screens */
    .app{
      position:relative;width:100%;max-width:430px;margin:0 auto;
      min-height:100dvh;background:var(--surface-primary);overflow:hidden;
    }
    @media (min-width:600px){
      body{background:#0b1a29;}
      .app{min-height:100dvh;box-shadow:0 0 60px rgba(0,0,0,.4);}
    }

    /* ---------- Screens ---------- */
    .screen{display:none;flex-direction:column;min-height:100dvh;}
    .screen.active{display:flex;}
    /* Calendar & city picker are fixed-height app shells: header and footer are
       pinned, only the middle region scrolls. min-height:0 lets the flex child scroll. */
    #screenCal,#screenCity{height:100dvh;max-height:100dvh;overflow:hidden;}

    /* ---------- HOME ---------- */
    #screenHome{background:var(--surface-primary);}
    .nav-top{display:flex;align-items:center;justify-content:space-between;padding:var(--sp-m) var(--sp-m) 0;}
    .logo-svg{display:block;height:28px;width:auto;}
    .lang{display:flex;align-items:center;gap:6px;color:var(--text-white);font-size:14px;font-weight:600;}
    .lang svg{display:block;}
    .cat-tabs{display:flex;gap:var(--sp-xs);padding:var(--sp-m);overflow-x:auto;scrollbar-width:none;}
    .cat-tabs::-webkit-scrollbar{display:none;}
    .cat{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:var(--radius-m);
      color:var(--text-white);font-size:16px;font-weight:600;white-space:nowrap;flex-shrink:0;}
    .cat svg{display:block;width:20px;height:20px;}
    .cat[aria-pressed="true"]{background:var(--accent);color:var(--text-primary);}
    h1.hero{margin:8px var(--sp-m) 0;color:var(--text-white);font-size:28px;line-height:36px;font-weight:800;letter-spacing:-.5px;}
    @media (max-width:360px){ h1.hero{font-size:24px;line-height:31px;} }

    .search-card{
      background:var(--surface-white);border-radius:var(--radius-l);
      padding:var(--sp-m);margin:var(--sp-xl) var(--sp-m) var(--sp-xl);
      display:flex;flex-direction:column;gap:var(--sp-m);
    }
    .trip-toggle{display:flex;align-items:center;background:var(--surface-quarternary);
      border-radius:var(--radius-full);padding:var(--sp-2xs);}
    .trip-toggle button{flex:1;padding:var(--sp-xs) 0;border-radius:var(--radius-full);
      font-size:14px;line-height:20px;font-weight:600;text-align:center;}
    .trip-toggle button[aria-pressed="true"]{background:var(--surface-white);}

    .fields{display:flex;flex-direction:column;gap:var(--sp-xs);}
    .loc-group{position:relative;border:1px solid var(--stroke-primary);border-radius:var(--radius-m);
      padding:var(--sp-xs) 0;display:flex;flex-direction:column;gap:var(--sp-xs);}
    .field{display:flex;flex-direction:column;padding:0 var(--sp-s);text-align:left;width:100%;}
    .field .lbl{font-size:14px;line-height:20px;font-weight:700;}
    .field .val{font-size:16px;line-height:24px;font-weight:600;}
    .field .val.placeholder{color:var(--text-muted);font-weight:600;}
    .loc-divider{height:1px;background:var(--stroke-primary);margin:0;}
    .swap{position:absolute;right:23px;top:50%;transform:translateY(-50%);
      width:40px;height:40px;border-radius:var(--radius-m);background:var(--surface-white);
      box-shadow:var(--shadow-s);display:grid;place-items:center;}
    .swap svg{display:block;width:20px;height:20px;}
    /* Dates / Passengers: px 12, py 8, label 14/20 + value 16/24 => 62px tall (Figma 2669:24091).
       Both label and value are clipped to one line so the two boxes always match height. */
    .row2{display:flex;gap:var(--sp-xs);align-items:stretch;}
    .row2 .field{border:1px solid var(--stroke-primary);border-radius:var(--radius-m);
      padding:var(--sp-xs) var(--sp-s);flex:1;min-width:0;justify-content:center;}
    .row2 .field .lbl,
    .row2 .field .val{display:block;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .nonstop{display:flex;align-items:center;gap:var(--sp-xs);}
    .nonstop .box{width:24px;height:24px;border:2px solid var(--stroke-primary);border-radius:var(--radius-m);
      flex-shrink:0;display:grid;place-items:center;}
    .nonstop .box svg{display:none;width:16px;height:16px;}
    .nonstop[aria-checked="true"] .box{background:var(--surface-primary);border-color:var(--surface-primary);}
    .nonstop[aria-checked="true"] .box svg{display:block;}
    .nonstop .txt{font-size:14px;line-height:20px;font-weight:600;}
    .cta{background:var(--accent);height:48px;border-radius:var(--radius-m);
      font-size:16px;line-height:24px;font-weight:700;width:100%;}

    /* ---------- CALENDAR ---------- */
    #screenCal{background:var(--surface-white);}
    .cal-head{background:var(--surface-white);border-bottom:1px solid var(--stroke-primary);
      padding:var(--sp-xl) var(--sp-m) var(--sp-m);display:flex;flex-direction:column;gap:var(--sp-xl);
      flex-shrink:0;z-index:5;}
    .cal-title-row{display:flex;align-items:center;gap:var(--sp-xl);}
    /* Back arrow: 24x24 icon box (Figma General/Arrow, icons/m = 24px).
       The svg needs explicit dimensions — without them it falls back to the
       browser default size instead of filling the 24px box. */
    .back{width:24px;height:24px;display:grid;place-items:center;flex-shrink:0;padding:0;}
    .back svg{display:block;width:24px;height:24px;}
    .cal-title{flex:1;min-width:0;font-size:20px;line-height:24px;font-weight:700;letter-spacing:-.5px;}
    /* Legend: green chip + caption, 8px apart (Figma 2671:24827) */
    .legend-row{display:flex;align-items:center;gap:var(--sp-xs);}
    .chip{background:var(--surface-success);border-radius:var(--radius-m);height:40px;
      padding:0 var(--sp-s);display:grid;place-items:center;flex-shrink:0;
      font-size:16px;line-height:24px;font-weight:600;font-variant-numeric:tabular-nums;}
    .legend-txt{font-size:14px;line-height:20px;}
    /* Info affordance + tooltip (Figma 2689:25517) — V2 only */
    /* The icon sits 8px after the caption (chip 117 + 8 + text 165 + 8), NOT pushed to
       the far edge — Figma 2689:25169 puts it at x=298 inside a 322-wide legend row. */
    .info-ico{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--surface-primary);
      color:#fff;font:italic 700 14px Georgia,serif;display:grid;place-items:center;
      position:relative;z-index:41;}
    .info-ico[hidden]{display:none;}
    .info-ico.open{box-shadow:0 0 0 8px #fff;}   /* 40x40 white halo (Figma 2689:25522) */
    .tip-backdrop{position:absolute;inset:0;background:rgba(0,34,62,.45);z-index:40;}
    .tip-backdrop[hidden]{display:none;}
    /* Card: 314x auto at x=33, 8px below the legend row (Figma 2689:25517) */
    .tip-card{position:absolute;top:120px;left:33px;right:43px;
      background:#fff;border-radius:var(--radius-m);padding:var(--sp-m);
      display:flex;flex-direction:column;gap:var(--sp-xs);
      box-shadow:0 8px 24px rgba(0,34,62,.18);}
    .tip-title{margin:0;font-size:14px;line-height:20px;font-weight:600;color:var(--text-primary);}
    .tip-body{margin:0;font-size:14px;line-height:20px;font-weight:400;color:var(--text-primary);}
    .tip-ok{align-self:flex-start;padding:0;font-size:14px;line-height:20px;font-weight:700;color:#0f8a0f;}
    .weekdays{display:flex;gap:var(--sp-xs);}
    .weekdays span{flex:1;min-width:0;text-align:center;font-size:14px;line-height:20px;}

    /* Months: 40px between month blocks, 24px between a month title and its grid
       (Figma 2671:24831 — months at 40px pitch, grid offset 48 from a 24px title) */
    .months{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
      display:flex;flex-direction:column;gap:40px;padding:var(--sp-xl) 0 var(--sp-m);}
    .month{padding:0 var(--sp-m);}
    .month h2{margin:0 0 var(--sp-xl);font-size:20px;line-height:24px;font-weight:700;letter-spacing:-.5px;}
    .grid{display:flex;flex-direction:column;gap:var(--sp-xs);}
    .week{display:flex;gap:var(--sp-xs);align-items:center;}
    /* Day cell: 40px tall, radius 8, semibold 16/24.
       Three stacked layers (Figma 2247:7592):
         ::before  z0  selected-range band (#f0f2f3)
         ::after   z1  pill — navy endpoint or green cheap day
         > span    z2  the date number                                        */
    .day{position:relative;flex:1;min-width:0;height:40px;
      display:grid;place-items:center;font-size:16px;line-height:24px;font-weight:600;
      font-variant-numeric:tabular-nums;padding:0;}
    .day > span{position:relative;z-index:2;}
    .day.empty{pointer-events:none;}
    .day.past{color:#b2bdc5;pointer-events:none;}
    /* Days strictly between the two endpoints: the band bleeds 4px past each
       side, exactly closing the 8px grid gap so it reads as one continuous bar. */
    .day.inrange::before{content:'';position:absolute;top:0;bottom:0;left:-4px;right:-4px;
      background:var(--surface-quinary);z-index:0;}
    /* Endpoints: a 12px connector pointing into the range, behind the navy pill. */
    .day.range-start::before,.day.range-end::before{content:'';position:absolute;top:0;bottom:0;
      width:12px;background:var(--surface-quinary);z-index:0;}
    .day.range-start::before{right:-6px;}
    .day.range-end::before{left:-6px;}
    /* Pills (source order matters: a selected endpoint outranks a cheap day). */
    .day.cheap::after,.day.sel::after{content:'';position:absolute;inset:0;
      border-radius:var(--radius-m);z-index:1;}
    .day.cheap::after{background:var(--surface-success);}
    .day.sel::after{background:var(--surface-primary);}
    .day.sel{color:var(--text-white);}

    /* Sticky footer: pt 16 / pb 24 / px 16, gap 12 (Figma 2669:24249) */
    .cal-foot{flex-shrink:0;border-top:1px solid var(--stroke-primary);background:var(--surface-white);
      padding:var(--sp-m) var(--sp-m) calc(var(--sp-xl) + env(safe-area-inset-bottom));
      display:flex;flex-direction:column;justify-content:flex-end;gap:var(--sp-s);}
    .range-txt{font-size:16px;line-height:24px;font-weight:600;width:100%;}
    .range-txt .muted{color:#667a8b;}   /* "Oneway" label (Figma 2671:24843) */

    /* ---------- City picker ---------- */
    #screenCity{background:var(--surface-white);}
    .city-head{padding:var(--sp-xl) var(--sp-m) var(--sp-m);display:flex;align-items:center;gap:var(--sp-m);
      border-bottom:1px solid var(--stroke-primary);flex-shrink:0;}
    .city-input{flex:1;min-width:0;border:1px solid var(--stroke-primary);border-radius:var(--radius-m);
      padding:var(--sp-xs) var(--sp-s);font-size:16px;line-height:24px;font-family:inherit;color:inherit;}
    .city-input:focus{outline:2px solid var(--surface-primary);outline-offset:-2px;}
    .city-list{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
    .city-item{display:block;width:100%;text-align:left;padding:var(--sp-s) var(--sp-m);
      font-size:16px;line-height:24px;border-bottom:1px solid var(--surface-quinary);}
    .city-item b{font-weight:700;}
    .city-item .code{color:var(--text-muted);font-size:14px;margin-left:6px;}

    /* ---------- Passengers sheet ---------- */
    .sheet-backdrop{position:fixed;inset:0;background:rgba(0,34,62,.45);z-index:40;display:none;}
    .sheet-backdrop.open{display:block;}
    .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface-white);
      border-radius:var(--radius-l) var(--radius-l) 0 0;padding:var(--sp-xl) var(--sp-m)
      calc(var(--sp-m) + env(safe-area-inset-bottom));max-width:430px;margin:0 auto;}
    .sheet h3{margin:0 0 var(--sp-m);font-size:20px;line-height:24px;font-weight:700;letter-spacing:-.5px;}
    .pax-row{display:flex;align-items:center;justify-content:space-between;padding:var(--sp-s) 0;}
    .pax-row .t{font-size:16px;font-weight:600;}
    .pax-row .s{font-size:14px;color:var(--text-muted);}
    .stepper{display:flex;align-items:center;gap:var(--sp-m);}
    .stepper button{width:36px;height:36px;border-radius:50%;border:1px solid var(--stroke-primary);
      display:grid;place-items:center;font-size:20px;font-weight:700;line-height:1;}
    .stepper button:disabled{opacity:.35;}
    .stepper .n{min-width:20px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;}
    .cabins{display:flex;flex-wrap:wrap;gap:var(--sp-xs);margin:var(--sp-xs) 0 var(--sp-m);}
    .cabins button{padding:8px 12px;border-radius:var(--radius-full);border:1px solid var(--stroke-primary);
      font-size:14px;font-weight:600;}
    .cabins button[aria-pressed="true"]{background:var(--surface-primary);color:var(--text-white);
      border-color:var(--surface-primary);}

    /* ---------- Toast ---------- */
    .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;
      background:var(--surface-primary);color:var(--text-white);padding:12px 20px;border-radius:var(--radius-m);
      font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center;}
    .toast.show{opacity:1;}

    /* ---------- Behaviour switch (preview only — removed in test builds) ---------- */
    .mode-switch{position:fixed;left:12px;bottom:12px;z-index:1000;display:flex;flex-direction:column;
      gap:6px;align-items:flex-start;}
    .mode-switch .ms-label{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
      color:#fff;background:rgba(0,34,62,.6);padding:2px 6px;border-radius:4px;}
    .mode-switch .ms-tabs{display:inline-flex;background:var(--surface-white);border:1px solid var(--stroke-primary);
      border-radius:999px;padding:3px;box-shadow:var(--shadow-s);}
    .mode-switch button{font-weight:600;font-size:12px;line-height:1;color:var(--text-muted);
      padding:8px 12px;border-radius:999px;}
    .mode-switch button[aria-pressed="true"]{background:var(--surface-primary);color:var(--text-white);}
  </style>
</head>

      <span class="lang">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18Z"/></svg>
        EN
      </span>
    </div>

    <nav class="cat-tabs">
      <button class="cat" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5L21 16Z"/></svg>
        Flights
      </button>
      <button class="cat">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c-4 0-8 .5-8 4v9.5A3.5 3.5 0 0 0 7.5 19L6 20.5v.5h12v-.5L16.5 19a3.5 3.5 0 0 0 3.5-3.5V6c0-3.5-3.6-4-8-4ZM7.5 17a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Zm3.5-7H6V6h5v4Zm2 0V6h5v4h-5Zm3.5 7a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Z"/></svg>
        Trains
      </button>
      <button class="cat">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 6a1.5 1.5 0 0 0-1.4-1H6.5a1.5 1.5 0 0 0-1.4 1L3 12v8a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-1h12v1a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-8l-2.1-6ZM6.5 16A1.5 1.5 0 1 1 8 14.5 1.5 1.5 0 0 1 6.5 16Zm11 0a1.5 1.5 0 1 1 1.5-1.5 1.5 1.5 0 0 1-1.5 1.5ZM5 11l1.5-4.5h11L19 11H5Z"/></svg>
        Cars
      </button>
      <button class="cat">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 13a3 3 0 1 0-3-3 3 3 0 0 0 3 3Zm12-1h-8v6H3V5H1v16h2v-3h18v3h2v-7a5 5 0 0 0-4-4.9Z"/></svg>
        Hotels
      </button>
    </nav>

    <h1 class="hero">Cheap flights: compare airline tickets and find the best deal</h1>

    <div class="search-card">
      <div class="trip-toggle" role="group" aria-label="Trip type">
        <button type="button" data-trip="round" aria-pressed="true">Round-trip</button>
        <button type="button" data-trip="oneway" aria-pressed="false">One-way</button>
      </div>

      <div class="fields">
        <div class="loc-group">
          <button class="field" id="fromField" type="button">
            <span class="lbl">Where from?</span>
            <span class="val" id="fromVal">Paris, France</span>
          </button>
          <div class="loc-divider"></div>
          <button class="field" id="toField" type="button">
            <span class="lbl">Where to?</span>
            <span class="val" id="toVal">Barcelona, Spain</span>
          </button>
          <button class="swap" id="swap" type="button" aria-label="Swap origin and destination">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v14M6 3 3 6M6 3l3 3M14 17V3M14 17l-3-3M14 17l3-3"/></svg>
          </button>
        </div>

        <div class="row2">
          <button class="field" id="datesField" type="button">
            <span class="lbl">Dates</span>
            <span class="val" id="datesVal">Aug 15 - Aug 18</span>
          </button>
          <button class="field" id="paxField" type="button">
            <span class="lbl">Passengers &amp; Seat…</span>
            <span class="val" id="paxVal">1 Adult, Economy</span>

      <button class="nonstop" id="nonstop" type="button" role="checkbox" aria-checked="false">
        <span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg></span>
        <span class="txt">Direct flights</span>

      <button class="cta" id="compare" type="button">Compare</button>

  </section>

  <!-- ============ SCREEN: CALENDAR ============ -->
  <section class="screen" id="screenCal">
    <div class="cal-head">
      <div class="cal-title-row">
        <button class="back" id="calBack" type="button" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M5 12l7-7M5 12l7 7"/></svg>
        </button>
        <h2 class="cal-title">Select your travel dates</h2>
      </div>
      <div class="legend-row">
        <span class="chip" id="legendChip">Under 200 €</span>
        <span class="legend-txt">Lowest fares in this period</span>
        <!-- V2 · Separate only: explains why the green days move (Figma 2689:25524) -->
        <button class="info-ico" id="infoBtn" type="button" hidden
                aria-label="About the highlighted days" aria-expanded="false">i</button>
      </div>
      <div class="weekdays" id="weekdays"></div>
    </div>

    <div class="months" id="months"></div>

    <div class="cal-foot">
      <span class="range-txt" id="rangeTxt"></span>
      <button class="cta" id="setDates" type="button">Set dates</button>
    </div>

  <!-- ============ SCREEN: CITY PICKER ============ -->
  <section class="screen" id="screenCity">
    <div class="city-head">
      <button class="back" id="cityBack" type="button" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M5 12l7-7M5 12l7 7"/></svg>
      </button>
      <input class="city-input" id="cityInput" type="text" autocomplete="off" placeholder="City, airport, train station" />
    </div>
    <div class="city-list" id="cityList"></div>
  </section>

  <!-- ============ Passengers sheet ============ -->
  <div class="sheet-backdrop" id="paxBackdrop">
    <div class="sheet" id="paxSheet" role="dialog" aria-label="Passengers and seat class">
      <h3>Passengers &amp; Seat class</h3>
      <div id="paxRows"></div>
      <div class="cabins" id="cabins"></div>
      <button class="cta" id="paxDone" type="button">Done</button>
    </div>
  </div>

  <!-- Behaviour tooltip (V2 · Separate only) -->
  <div class="tip-backdrop" id="tipBackdrop" hidden>
    <div class="tip-card" role="dialog" aria-label="About the highlighted days">
      <p class="tip-title">Green updates as you go</p>
      <p class="tip-body">It marks the cheapest days to set off, then the cheapest days to return.</p>
      <button class="tip-ok" id="tipOk" type="button">Got it</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<!--MODE_SWITCH_START-->
<div class="mode-switch" role="group" aria-label="Calendar behaviour">
  <span class="ms-label">Calendar behaviour</span>
  <div class="ms-tabs">
    <button type="button" data-behavior="static" aria-pressed="true" title="Green never changes as you pick dates">V1 · Static</button>
    <button type="button" data-behavior="separate" aria-pressed="false" title="Green follows the field you're editing">V2 · Separate</button>
  </div>
</div>
<!--MODE_SWITCH_END-->

<script>
  const $ = id => document.getElementById(id);

  /* ---------- Data ---------- */
  const CITIES = [
    { label:'Paris, France', code:'CDG' },
    { label:'Barcelona, Spain', code:'BCN' },
    { label:'Madrid, Spain', code:'MAD' },
    { label:'London, United Kingdom', code:'LON' },
    { label:'Rome, Italy', code:'FCO' },
    { label:'Milan, Italy', code:'MXP' },
    { label:'Berlin, Germany', code:'BER' },
    { label:'Amsterdam, Netherlands', code:'AMS' },
    { label:'Lisbon, Portugal', code:'LIS' },
    { label:'Budapest, Hungary', code:'BUD' },
    { label:'Agadir, Morocco', code:'AGA' },
    { label:'Marrakesh, Morocco', code:'RAK' },
    { label:'Casablanca, Morocco', code:'CMN' },
    { label:'New York, United States', code:'JFK' },
    { label:'Dubai, United Arab Emirates', code:'DXB' },
    { label:'Tokyo, Japan', code:'HND' },
  ];
  const CABINS = ['Economy','Premium economy','Business','First class'];
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const WEEKDAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const MONTHS_SHOWN = 12;

  /* ---------- Helpers ---------- */
  function startOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function sameDay(a,b){ return a && b && a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
  function addMonths(d,n){ return new Date(d.getFullYear(), d.getMonth()+n, 1); }
  function esc(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
  function boldMatch(text,q){
    if(!q) return esc(text);
    const i = text.toLowerCase().indexOf(q.toLowerCase());
    if(i<0) return esc(text);
    return esc(text.slice(0,i))+'<b>'+esc(text.slice(i,i+q.length))+'</b>'+esc(text.slice(i+q.length));
  }

  /* ---------- State ---------- */
  const state = {
    behavior: 'static',                // 'static' (V1) | 'separate' (V2)
    tripType:'round',
    departure:new Date(2026,7,15),     // preselected trip: Sat, Aug 15 …
    return:new Date(2026,7,18),        // … → Tue, Aug 18
    activeField:'departure',
    minDate:startOfDay(new Date(2026,7,12)),   // "today"
    viewStart:new Date(2026,7,1),      // calendar opens on August 2026
    from:{ label:'Paris, France', code:'CDG' },
    to:{ label:'Barcelona, Spain', code:'BCN' },
    pax:{ adults:1, children:0, infants:0, cabin:'Economy' },
    nonstop:false,
    cityTarget:null,                   // 'from' | 'to'
  };

  /* ---------- Pricing (identical model to the desktop build) ---------- */
  const SEASON = [185,168,190,215,250,300,345,335,240,205,178,295];
  function priceFor(d){
    const seed = (d.getFullYear()*372 + d.getMonth()*31 + d.getDate()) * 2654435761 % 2147483647;
    const r = (Math.abs(seed) % 1000) / 1000;
    const weekend = (d.getDay()===5 || d.getDay()===6) ? 45 : 0;
    return Math.round(SEASON[d.getMonth()] + r*90 + weekend);
  }
  // Return-flight price depends on BOTH the chosen departure and the candidate return,
  // so the cheapest set shifts once a departure is picked — the V2 dynamic behaviour.
  function priceForReturn(dep,d){
    const depSeed = dep.getMonth()*53 + dep.getDate()*17;
    const seed = ((d.getFullYear()*372 + d.getMonth()*31 + d.getDate()) * 2654435761 + depSeed*40503) % 2147483647;
    const r = (Math.abs(seed) % 1000) / 1000;
    const tripLen = Math.round((d - dep) / 86400000);
    const lenPenalty = Math.abs(tripLen - 7) * 5;
    const weekend = (d.getDay()===5 || d.getDay()===6) ? 55 : 0;
    return Math.round(150 + r*150 + lenPenalty + weekend);
  }
  function useReturnPricing(){
    return (state.tripType==='round' && state.departure) &&
           (state.behavior==='separate' && state.activeField==='return');
  }
  function cheapDaysForMonth(base){
    const year=base.getFullYear(), month=base.getMonth();
    const days=new Date(year,month+1,0).getDate();
    const useReturns=useReturnPricing();
    const arr=[];
    for(let d=1; d<=days; d++){
      const date=new Date(year,month,d);
      if(date < state.minDate) continue;              // never highlight past days
      if(useReturns){
        if(date <= state.departure) continue;         // a return must be after the departure
        arr.push({ d, p:priceForReturn(state.departure,date) });
      } else {
        arr.push({ d, p:priceFor(date) });
      }
    }
    if(!arr.length) return { set:new Set(), max:null };
    arr.sort((a,b)=> a.p-b.p || a.d-b.d);
    const seed=(year*31+month)>>>0;
    const count=8+(seed%3);                           // deterministic 8..10 per month
    const picked=arr.slice(0,Math.min(count,arr.length));
    return { set:new Set(picked.map(x=>x.d)), max:picked[picked.length-1].p };
  }

  /* ---------- Formatting ---------- */
  function fmtShort(d){ return d ? MONTHS[d.getMonth()].slice(0,3)+' '+d.getDate() : ''; }
  function fmtLong(d){ return d ? DOW[d.getDay()]+', '+MONTHS[d.getMonth()].slice(0,3)+' '+d.getDate() : ''; }
  function paxCount(){ return state.pax.adults + state.pax.children + state.pax.infants; }
  // "1 Adult, Economy" while it's adults-only; falls back to a passenger count once mixed.
  function paxText(){
    const {adults,children,infants,cabin}=state.pax;
    const n=adults+children+infants;
    const who=(children+infants===0)
      ? adults+' Adult'+(adults===1?'':'s')
      : n+' Passenger'+(n===1?'':'s');
    return who+', '+cabin;
  }
  // Footer summary. With only a departure chosen the trip reads as one-way and
  // the label is muted (Figma 2671:24843).
  function rangeText(){
    const d=state.departure, r=(state.tripType==='round')?state.return:null;
    if(d&&r) return esc(fmtLong(d))+' - '+esc(fmtLong(r));
    if(d) return esc(fmtLong(d))+' - <span class="muted">Oneway</span>';
    return 'Select your dates';
  }

  /* ---------- Screens ---------- */
  /* Hash routing.
     Each screen has a real URL so it survives a page reload and can be linked
     to directly. This matters for test tooling (Useberry): without it, any
     reload of the frame silently resets the prototype to the home screen, so a
     click recorded on the calendar actually lands on "#screenHome".
       #/search  home / search form
       #/dates   calendar (date picker)
       #/city    city picker
     Deep links: append the hash to the page URL, e.g. …/mobile-a.html#/dates */
  const ROUTE_OF  = { screenHome:'#/search', screenCal:'#/dates', screenCity:'#/city' };
  const SCREEN_OF = { '#/search':'screenHome', '#/dates':'screenCal', '#/city':'screenCity',
                      // Confirming the calendar lands on a DISTINCT url that still renders the
                      // search form. Gives the test tool an unambiguous completion signal:
                      // "task complete when the URL contains #/dates-set".
                      '#/dates-set':'screenHome' };

  function show(id){
    document.querySelectorAll('.screen').forEach(s=> s.classList.toggle('active', s.id===id));
    window.scrollTo(0,0);
  }
  // Screen swaps are deferred one beat so click/trigger recorders resolve the
  // element that was actually clicked before the DOM swaps screens.
  const NAV_DELAY = 160;
  function navHash(h){
    setTimeout(()=>{
      if(location.hash === h) applyRoute();      // same route → just re-render
      else location.hash = h;                    // otherwise hashchange drives it
    }, NAV_DELAY);
  }
  function navTo(id){ navHash(ROUTE_OF[id] || '#/search'); }
  function applyRoute(){
    const id = SCREEN_OF[location.hash] || 'screenHome';
    if(id==='screenCal'){ renderCalendar(); }
    if(id==='screenCity'){
      if(!state.cityTarget) state.cityTarget='from';
      renderCityList(($('cityInput').value||'').trim());
    }
    if(id==='screenHome'){ syncHome(); }
    show(id);
  }
  window.addEventListener('hashchange', applyRoute);

  /* ---------- Home fields ---------- */
  function syncHome(){
    $('fromVal').textContent = state.from ? state.from.label : 'City, airport, train station';
    $('fromVal').classList.toggle('placeholder', !state.from);
    $('toVal').textContent = state.to ? state.to.label : 'City, airport, train station';
    $('toVal').classList.toggle('placeholder', !state.to);
    const d=state.departure, r=(state.tripType==='round')?state.return:null;
    $('datesVal').textContent = d ? (r ? fmtShort(d)+' - '+fmtShort(r) : fmtShort(d)) : 'Select';
    $('paxVal').textContent = paxText();
  }

  /* ---------- Calendar ---------- */
  function renderWeekdays(){
    $('weekdays').innerHTML = WEEKDAYS.map(w=>'<span>'+w+'</span>').join('');
  }
  function renderCalendar(){
    const host=$('months'); host.innerHTML='';
    let chipMax=null;
    // the month the user is working in drives the legend chip
    const focus = state.departure || state.viewStart;
    // Selected range (round trips only, and only once both ends are chosen)
    const dep=state.departure, ret=(state.tripType==='round')?state.return:null;
    const hasRange = !!(dep && ret && ret>dep);

    for(let i=0;i<MONTHS_SHOWN;i++){
      const base=addMonths(state.viewStart,i);
      const y=base.getFullYear(), m=base.getMonth();
      const {set:cheap, max} = cheapDaysForMonth(base);
      if(y===focus.getFullYear() && m===focus.getMonth()) chipMax=max;

      const sec=document.createElement('section'); sec.className='month';
      const h=document.createElement('h2'); h.textContent=MONTHS[m]+' '+y; sec.appendChild(h);

      const grid=document.createElement('div'); grid.className='grid';
      const first=new Date(y,m,1);
      const lead=(first.getDay()+6)%7;                 // Monday-first
      const days=new Date(y,m+1,0).getDate();
      let week=document.createElement('div'); week.className='week';
      for(let k=0;k<lead;k++){ const e=document.createElement('div'); e.className='day empty'; week.appendChild(e); }
      for(let d=1; d<=days; d++){
        const date=new Date(y,m,d);
        const past=date<state.minDate;
        const isSel=sameDay(date,state.departure)||(state.tripType==='round'&&sameDay(date,state.return));
        const isStart=hasRange&&sameDay(date,dep);
        const isEnd=hasRange&&sameDay(date,ret);
        const inRange=hasRange&&date>dep&&date<ret;
        // Inside the selected range the range styling wins — no green cheap days.
        const isCheap=cheap.has(d)&&!isSel&&!inRange;
        const cell=document.createElement('button');
        cell.type='button';
        cell.className='day'+(past?' past':'')+(isCheap?' cheap':'')+(isSel?' sel':'')
          +(inRange?' inrange':'')+(isStart?' range-start':'')+(isEnd?' range-end':'');
        const num=document.createElement('span'); num.textContent=d; cell.appendChild(num);
        if(!past) cell.addEventListener('click',()=>pick(date));
        week.appendChild(cell);
        if(week.children.length===7){ grid.appendChild(week); week=document.createElement('div'); week.className='week'; }
      }
      if(week.children.length){
        while(week.children.length<7){ const e=document.createElement('div'); e.className='day empty'; week.appendChild(e); }
        grid.appendChild(week);
      }
      sec.appendChild(grid); host.appendChild(sec);
    }

    if(chipMax==null){ const f=cheapDaysForMonth(state.viewStart); chipMax=f.max; }
    $('legendChip').textContent = chipMax!=null ? 'Under '+(Math.ceil(chipMax/10)*10)+' €' : '—';
    $('rangeTxt').innerHTML = rangeText();
  }
  function pick(date){
    if(state.tripType==='oneway'){
      state.departure=date; state.return=null; state.activeField='departure';
      renderCalendar(); return;
    }
    if(state.activeField==='departure'){
      state.departure=date; state.return=null; state.activeField='return';
    } else {
      if(date < state.departure){ state.departure=date; state.return=null; state.activeField='return'; }
      else { state.return=date; state.activeField='departure'; }
    }
    renderCalendar();
  }

  /* ---------- City picker ---------- */
  function openCity(target){
    state.cityTarget=target;
    $('cityInput').value='';
    renderCityList('');
    navTo('screenCity');
    setTimeout(()=>$('cityInput').focus(), NAV_DELAY+50);
  }
  function renderCityList(q){
    const list=CITIES.filter(c=> !q || c.label.toLowerCase().includes(q.toLowerCase()) || c.code.toLowerCase().includes(q.toLowerCase()));
    $('cityList').innerHTML = list.map(c=>
      '<button class="city-item" type="button" data-code="'+c.code+'">'+boldMatch(c.label,q)+'<span class="code">'+c.code+'</span></button>'
    ).join('') || '<div class="city-item" style="color:var(--text-muted)">No matches</div>';
    $('cityList').querySelectorAll('.city-item[data-code]').forEach(b=>{
      b.addEventListener('click',()=>{
        const city=CITIES.find(c=>c.code===b.dataset.code);
        if(state.cityTarget==='from') state.from=city; else state.to=city;
        syncHome(); navTo('screenHome');
      });
    });
  }

  /* ---------- Passengers ---------- */
  function renderPax(){
    const rows=[
      { key:'adults', t:'Adults', s:'12+ years', min:1 },
      { key:'children', t:'Children', s:'2–11 years', min:0 },
      { key:'infants', t:'Infants', s:'Under 2', min:0 },
    ];
    $('paxRows').innerHTML = rows.map(r=>
      '<div class="pax-row"><div><div class="t">'+r.t+'</div><div class="s">'+r.s+'</div></div>'+
      '<div class="stepper"><button type="button" data-k="'+r.key+'" data-v="-1">−</button>'+
      '<span class="n">'+state.pax[r.key]+'</span>'+
      '<button type="button" data-k="'+r.key+'" data-v="1">+</button></div></div>'
    ).join('');
    $('paxRows').querySelectorAll('button').forEach(b=>{
      const k=b.dataset.k, v=+b.dataset.v, min=rows.find(r=>r.key===k).min;
      if(v<0 && state.pax[k]<=min) b.disabled=true;
      if(v>0 && paxCount()>=9) b.disabled=true;
      b.addEventListener('click',()=>{ state.pax[k]=Math.max(min,state.pax[k]+v); renderPax(); });
    });
    $('cabins').innerHTML = CABINS.map(c=>
      '<button type="button" aria-pressed="'+(c===state.pax.cabin)+'">'+c+'</button>'
    ).join('');
    $('cabins').querySelectorAll('button').forEach(b=>{
      b.addEventListener('click',()=>{ state.pax.cabin=b.textContent; renderPax(); });
    });
  }
  function openPax(){ renderPax(); $('paxBackdrop').classList.add('open'); }
  function closePax(){ $('paxBackdrop').classList.remove('open'); syncHome(); }

  /* ---------- Behaviour tooltip (V2 · Separate only) ---------- */
  function openTip(){
    $('tipBackdrop').hidden=false;
    $('infoBtn').classList.add('open');
    $('infoBtn').setAttribute('aria-expanded','true');
  }
  function closeTip(){
    $('tipBackdrop').hidden=true;
    $('infoBtn').classList.remove('open');
    $('infoBtn').setAttribute('aria-expanded','false');
  }
  // The affordance only exists in V2, where the green days actually move.
  function syncTip(){
    const show = (state.behavior==='separate');
    $('infoBtn').hidden = !show;
    if(!show) closeTip();
  }

  /* ---------- Toast ---------- */
  let toastT=null;
  function toast(msg){
    const t=$('toast'); t.textContent=msg; t.classList.add('show');
    clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2400);
  }

  /* ---------- Wiring ---------- */
  document.querySelectorAll('.trip-toggle button').forEach(b=>{
    b.addEventListener('click',()=>{
      state.tripType=b.dataset.trip;
      document.querySelectorAll('.trip-toggle button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
      if(state.tripType==='oneway') state.return=null;
      else if(!state.return && state.departure){
        const d=state.departure; state.return=new Date(d.getFullYear(),d.getMonth(),d.getDate()+4);
      }
      state.activeField='departure';
      syncHome();
    });
  });
  document.querySelectorAll('.cat-tabs .cat').forEach(b=>{
    b.addEventListener('click',()=>{
      document.querySelectorAll('.cat-tabs .cat').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
      if(b.getAttribute('aria-pressed')==='true' && !/Flights/.test(b.textContent)) toast('Prototype — only Flights is available');
    });
  });
  $('fromField').addEventListener('click',()=>openCity('from'));
  $('toField').addEventListener('click',()=>openCity('to'));
  $('swap').addEventListener('click',()=>{ const t=state.from; state.from=state.to; state.to=t; syncHome(); });
  $('cityBack').addEventListener('click',()=>navTo('screenHome'));
  $('cityInput').addEventListener('input',e=>renderCityList(e.target.value.trim()));

  $('datesField').addEventListener('click',()=>{
    state.activeField='departure';
    navTo('screenCal');            // applyRoute() renders the calendar
  });
  $('calBack').addEventListener('click',()=>{ syncHome(); navTo('screenHome'); });
  // Task-completion trigger for the usability test: bind Useberry to "#setDates".
  $('setDates').addEventListener('click',()=>{
    // Confirming with only a departure picked turns the search into a one-way trip.
    if(state.departure && !state.return && state.tripType!=='oneway'){
      state.tripType='oneway';
      document.querySelectorAll('.trip-toggle button')
        .forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.trip==='oneway')));
    }
    syncHome(); navHash('#/dates-set');   // distinct URL = task-completion signal
  });

  $('infoBtn').addEventListener('click',()=>{ $('tipBackdrop').hidden ? openTip() : closeTip(); });
  $('tipOk').addEventListener('click',closeTip);
  $('tipBackdrop').addEventListener('click',e=>{ if(e.target===$('tipBackdrop')) closeTip(); });

  $('paxField').addEventListener('click',openPax);
  $('paxDone').addEventListener('click',closePax);
  $('paxBackdrop').addEventListener('click',e=>{ if(e.target===$('paxBackdrop')) closePax(); });

  $('nonstop').addEventListener('click',()=>{
    state.nonstop=!state.nonstop;
    $('nonstop').setAttribute('aria-checked',String(state.nonstop));
  });
  $('compare').addEventListener('click',()=>toast('Prototype — this is where results would load'));

  /* ---- Calendar-behaviour switch (preview only; removed in the test builds) ---- */
  document.querySelectorAll('.mode-switch button').forEach(b=>{
    b.addEventListener('click',()=>{
      state.behavior=b.dataset.behavior;
      document.querySelectorAll('.mode-switch button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
      // every version restarts from the same preselected 4-day trip
      state.departure=new Date(2026,7,15);
      state.return=new Date(2026,7,18);
      state.activeField='departure';
      syncTip();
      syncHome();
      if($('screenCal').classList.contains('active')) renderCalendar();
    });
  });

  /* ---------- Init ---------- */
  renderWeekdays();
  syncTip();
  syncHome();
  applyRoute();   // honour a deep link (e.g. …#/dates) on first load
</script>
</body>
</html>
